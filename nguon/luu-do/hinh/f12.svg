break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B1. Có thực sự quá ngày? Sổ khám thai, PARA, tự nhiên hay HTSS. Tính tuổi thai như FGR: kinh chót, đều, tránh thai, kinh áp chót, đối chiếu siêu âm TCN1</p></span></div></foreignObject></g></g><g transform="translate(313, 250.5)" id="flowchart-B-385" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Rà sổ: TCN1 (di truyền, thiếu máu, nhiễm trùng), TCN2 (TSG, THA, ĐTĐ, sinh non, nhau tiền đạo)</p></span></div></foreignObject></g></g><g transform="translate(313, 399.25)" id="flowchart-C-387" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B2. Tiền căn ngắn gọn. Bệnh sử: đau bụng, ra huyết, ra nước, thai máy</p></span></div></foreignObject></g></g><g transform="translate(313, 548)" id="flowchart-D-389" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B3. Khám ngoài: BCTC, cơn gò, Leopold, tim thai. Khám trong: âm đạo, CTC, cùng đồ, phần phụ, khung chậu</p></span></div></foreignObject></g></g><g transform="translate(313, 685.5)" id="flowchart-E-391" class="node default"><rect height="75" width="290" y="-37.5" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -22.5)" style="" class="label"><rect></rect><foreignObject height="45" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Xét nghiệm: NST, siêu âm (AFI, sinh trắc)</p></span></div></foreignObject></g></g><g transform="translate(313, 823)" id="flowchart-F-393" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B4. Kết luận: thai &gt; 40 tuần, bánh nhau giảm chức năng; kéo dài gây suy thai, thai lưu, mẹ tăng mổ, BHSS</p></span></div></foreignObject></g></g><g transform="translate(153, 983)" id="flowchart-G-395" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Nhập viện, CDTK bằng KPCD (foley, oxytocin, prostaglandin), dựa vào NST để chọn phương pháp</p></span></div></foreignObject></g></g><g transform="translate(473, 983)" id="flowchart-H-397" 