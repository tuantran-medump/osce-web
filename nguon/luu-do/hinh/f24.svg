eight: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>(1) Giới thiệu, hỏi lý do: đau bụng đột ngột, gò liên tục, ra máu đỏ</p></span></div></foreignObject></g></g><g transform="translate(153, 171.75)" id="flowchart-B-747" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>(2) Mượn sổ khám thai: nguy cơ thai kỳ, tuổi thai, loại trừ nhau tiền đạo (nhau nhóm I), yếu tố vỡ TC</p></span></div></foreignObject></g></g><g transform="translate(153, 298)" id="flowchart-C-749" class="node default"><rect height="75" width="290" y="-37.5" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -22.5)" style="" class="label"><rect></rect><foreignObject height="45" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Hướng chẩn đoán: nhau bong non, cần khám và XN</p></span></div></foreignObject></g></g><g transform="translate(153, 458)" id="flowchart-D-751" class="node default"><rect height="165" width="290" y="-82.5" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -67.5)" style="" class="label"><rect></rect><foreignObject height="135" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>(3) Gọi hỗ trợ. Khám: sinh hiệu, tổng trạng; bụng (phản ứng thành bụng, phản ứng dội); BCTC, tim thai Doppler, cơn gò; khám trong (xóa mở, ngôi, máu theo găng, khung chậu, loại trừ sa dây rốn)</p></span></div></foreignObject></g></g><g transform="translate(153, 618)" id="flowchart-E-753" class="node default"><rect height="75" width="290" y="-37.5" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -22.5)" style="" class="label"><rect></rect><foreignObject height="45" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>(4) CTG + siêu âm sản khoa cấp cứu</p></span></div></foreignObject></g></g><g transform="translate(153, 778)" id="flowchart-F-755" class="node default"><rect height="165" width="290" y="-82.5" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -67.5)" style="" class="label"><rect></rect><foreignObject height="135" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Nhận định mẹ: sốc, tăng trương lực, gò cường tính, ối đỏ máu, loại trừ bụng ngoại khoa → nhau bong non thể nặng. Con: giảm muộn lặp lại → suy thai, non tháng</p></span></div></foreignObject></g></g><g transform="translate(153, 960.5)" id="flowchart-G-757" class="node default danger"><rect height="120" width="290" y="-60" x="-145" style="fill:#FDE2E2 !important;stroke:#C0392B !important" class="basic label-container"></rect><g transform="translate(-115, -45)" style="color:#7a1010 !important" class="label"><rect></rect><foreignObject height="90" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(122, 16, 16) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" style="color:#7a1010 !important"><p>(5) Mổ sanh cấp cứu ngay + hồi sức chống sốc. Chuẩn bị đối phó băng huyết, rối loạn đông máu, chăm sóc bé</p></span></div></foreignObject></g></g><g transform="translate(153, 1120.5)" id="flowchart-H-759" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Tiên lượng: BHSS do rối loạn đông máu, sốc, DIC; thai xấu nhanh, tử vong cao; non tháng; nguy cơ vẫn còn dù mổ</p></span></div></foreignObject></g></g></g></g></g></svg>