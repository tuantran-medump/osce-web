/foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(153, 113)" id="flowchart-A-304" class="node default"><rect height="210" width="290" y="-105" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -90)" style="" class="label"><rect></rect><foreignObject height="180" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Sau trễ kinh (1 lần): siêu âm sống còn, vị trí, số lượng thai, bất thường. Tính tuổi thai, ngày dự sanh. Sức khỏe mẹ: huyết đồ, nhóm máu, Rh, Rubella, giang mai, HBsAg, HIV, đường huyết, TPTNT, AST ALT BUN Creatinine. Khám phụ khoa</p></span></div></foreignObject></g></g><g transform="translate(153, 363)" id="flowchart-B-305" class="node default"><rect height="210" width="290" y="-105" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -90)" style="" class="label"><rect></rect><foreignObject height="180" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>11w0–13w6 (1 lần): định tuổi thai bằng CRL. Tầm soát lệch bội (combined, NIPT, sinh thiết gai nhau). Siêu âm hình thái TCN1. Huyết đồ. Tầm soát nhiễm trùng. Tầm soát TSG (PlGF, Doppler ĐMTC, HA trung bình). TPTNT. OGTT nếu nguy cơ cao</p></span></div></foreignObject></g></g><g transform="translate(153, 624.25)" id="flowchart-C-307" class="node default"><rect height="232.5" width="290" y="-116.25" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -101.25)" style="" class="label"><rect></rect><foreignObject height="202.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>14w0–28w6 (mỗi tháng, 4 lần): siêu âm hình thái 20–25w. Lệch bội TCN2 (soft marker 15–18w6, triple test 16–18w, NIPT, chọc ối từ 15w). OGTT 24–28w. Chiều dài CTC từ 19w. HBV-DNA 26–28w nếu VGB. VAT1, VAT2. Mỗi lần: mạch, HA, TPTNT, phù, BCTC, tim thai, siêu âm</p></span></div></foreignObject></g></g><g transform="translate(153, 851.75)" id="flowchart-D-309" class="node default"><rect height="142.5" width="290" y="-71.25" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -56.25)" style="" class="label"><rect></rect><foreignObject height="112.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>29w0–36w6 (2 tuần/lần, 3 lần): hướng dẫn đếm cử động thai, HIV, giang mai, NST từ 34w, khung chậu, GBS 36–38w, MRI nếu nghi nhau cài răng lược</p></span></div></foreignObject></g></g><g transform="translate(153, 1023)" id="flowchart-E-311" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>37w0–39w6 (mỗi tuần, 4 lần): đếm cử động thai, công thức máu, theo dõi như trên, X-quang chậu nếu khung chậu bất thường</p></span></div></foreignObject></g></g><g transform="translate(153, 1160.5)" id="flowchart-F-313" class="node default warn"><rect height="75" width="290" y="-37.5" x="-145" style="fill:#FFF4CC !important;stroke:#C9A227 !important" class="basic label-container"></rect><g transform="translate(-115, -22.5)" style="color:#5a4500 !important" class="label"><rect></rect><foreignObject height="45" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(90, 69, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" style="color:#5a4500 !important"><p>40w0–40w6: mỗi 3 ngày (2 lần). ⚠ File không ghi nội dung khám</p></span></div></foreignObject></g></g><g transform="translate(153, 1264.25)" id="flowchart-G-315" class="node default"><rect height="52.5" width="192.625" y="-26.25" x="-96.3125" style="" class="basic label-container"></rect><g transform="translate(-66.3125, -11.25)" style="" class="label"><rect></rect><foreignObject height="22.5" width="132.625"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 230px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Từ 41w0: nhập viện</p></span></div></foreignObject></g></g><g transform="translate(473, 113)" id="flowchart-H-316" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Không đủ điều kiện: tối thiểu 3 lần 12w, 22w, 32w, nhập viện khi chuyển dạ</p></span></div></foreignObject></g></g><g transform="translate(793, 113)" id="flowchart-I-317" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Mọi lần: tái khám ngay khi đau bụng, ra huyết, ra nước, nhức đầu, nhìn mờ, chóng mặt, thai máy ít</p></span></div></foreignObject></g></g></g></g></g></svg>