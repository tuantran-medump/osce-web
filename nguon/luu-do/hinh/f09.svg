ect{fill:hsl(31.7647058824, 68%, 100%);stroke:hsl(31.7647058824, 28%, 90%);stroke-width:1px;}#f09 .cluster text{fill:#000000;}#f09 .cluster span{color:#000000;}#f09 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,Helvetica,sans-serif;font-size:12px;background:hsl(31.7647058824, 68%, 100%);border:1px solid hsl(31.7647058824, 28%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#f09 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#13283f;}#f09 rect.text{fill:none;stroke-width:0;}#f09 .icon-shape,#f09 .image-shape{background-color:#ffffff;text-align:center;}#f09 .icon-shape p,#f09 .image-shape p{background-color:#ffffff;padding:2px;}#f09 .icon-shape rect,#f09 .image-shape rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#f09 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}#f09 .warn&gt;*{fill:#FFF4CC!important;stroke:#C9A227!important;color:#5a4500!important;}#f09 .warn span{fill:#FFF4CC!important;stroke:#C9A227!important;color:#5a4500!important;}#f09 .warn tspan{fill:#5a4500!important;}#f09 .danger&gt;*{fill:#FDE2E2!important;stroke:#C0392B!important;color:#7a1010!important;}#f09 .danger span{fill:#FDE2E2!important;stroke:#C0392B!important;color:#7a1010!important;}#f09 .danger tspan{fill:#7a1010!important;}</style><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="f09_flowchart-v2-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="f09_flowchart-v2-pointStart"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11"