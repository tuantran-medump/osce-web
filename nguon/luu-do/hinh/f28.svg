nObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(153, 68)" id="flowchart-A-804" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Rửa tay 7 bước. Tư thế sản phụ (tư thế sản khoa, mông sát mép bàn, che đắp, bộc lộ vừa đủ). Người khám đứng bên phải</p></span></div></foreignObject></g></g><g transform="translate(153, 216.75)" id="flowchart-B-805" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Đo BCTC: xác định bờ trên xương vệ, đáy TC, thước căng ôm sát</p></span></div></foreignObject></g></g><g transform="translate(153, 410.5)" id="flowchart-C-807" class="node default"><rect height="210" width="290" y="-105" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -90)" style="" class="label"><rect></rect><foreignObject height="180" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Leopold 1: đáy TC (đầu hay mông). Leopold 2: hai bên (lưng phẳng, chi lổn nhổn). Leopold 3: trên xương vệ (cực dưới). Leopold 4: quay về chân sản phụ, hai tay hội tụ = chưa lọt, phân kỳ = đã lọt. Kết luận ngôi, lưng, độ lọt .../5</p></span></div></foreignObject></g></g><g transform="translate(153, 604.25)" id="flowchart-D-809" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Nghe tim thai: bôi gel, vị trí theo lưng, nghe 1 phút, kết luận tần số, đều, cường độ. Lau gel</p></span></div></foreignObject></g></g><g transform="translate(153, 741.75)" id="flowchart-E-811" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Bắt cơn gò: tay đặt vùng rốn, 10 phút hoặc 3 cơn: tần số, cường độ, trương lực cơ bản</p></span></div></foreignObject></g></g><g transform="translate(153, 901.75)" id="flowchart-F-813" class="node default"><rect height="142.5" width="290" y="-71.25" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -56.25)" style="" class="label"><rect></rect><foreignObject height="112.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Khám trong: rửa tay, găng vô khuẩn, 1 ngón rồi 2 ngón. Xóa mở, hướng, mật độ CTC; ối; ngôi, kiểu thế; độ lọt; khung chậu (eo trên, giữa, dưới)</p></span></div></foreignObject></g></g><g transform="translate(153, 1084.25)" id="flowchart-G-815" class="node default"><rect height="142.5" width="290" y="-71.25" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -56.25)" style="" class="label"><rect></rect><foreignObject height="112.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Tháo găng, rửa tay, nói kết luận: âm hộ, âm đạo, CTC, ối, ngôi, kiểu thế, chồng xương, độ lọt (khớp khám bụng), khung chậu không hẹp</p></span></div></foreignObject></g></g></g></g></g></svg>