le="" class="label"><rect></rect><foreignObject height="45" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Khám: sinh hiệu mẹ, BCTC, cơn gò, Leopold, khám trong</p></span></div></foreignObject></g></g><g transform="translate(313, 514.25)" id="flowchart-D-373" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B3. Đề nghị NST (phải nói đúng tên non-stress test), thêm AFI, Doppler tùy YTNC</p></span></div></foreignObject></g></g><g transform="translate(313, 655.109375)" id="flowchart-E-375" class="node default"><polygon transform="translate(-52.109375,52.109375)" class="label-container" points="52.109375,0 104.21875,-52.109375 52.109375,-104.21875 0,-52.109375"></polygon><g transform="translate(-25.859375, -11.25)" style="" class="label"><rect></rect><foreignObject height="22.5" width="51.71875"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 230px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Kết quả</p></span></div></foreignObject></g></g><g transform="translate(153, 818.46875)" id="flowchart-F-377" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Thai bình thường, có thể bé đang ngủ (chu kỳ 20–40 phút, không quá 90 phút)</p></span></div></foreignObject></g></g><g transform="translate(153, 967.21875)" id="flowchart-G-379" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Hướng dẫn đếm: sau ăn, tắm, nơi yên tĩnh. Đếm 1 giờ, chưa đủ 4 thì đếm thêm 1 giờ. &lt; 6 cử động / 2 giờ là giảm, đi khám ngay</p></span></div></foreignObject></g></g><g transform="translate(153, 1115.96875)" id="flowchart-H-381" class="node default"><rect height="97.5" width="290" y="-48.75" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="" class="label"><rect></rect><foreignObject height="67.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Hẹn tái khám sau 1 tuần. Đến ngay khi đau bụng, ra huyết, ra dịch âm đạo</p></span></div></foreignObject></g></g><g transform="translate(473, 818.46875)" id="flowchart-I-383" class="node default warn"><rect height="75" width="290" y="-37.5" x="-145" style="fill:#FFF4CC !important;stroke:#C9A227 !important" class="basic label-container"></rect><g transform="translate(-115, -22.5)" style="color:#5a4500 !important" class="label"><rect></rect><foreignObject height="45" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(90, 69, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" sty