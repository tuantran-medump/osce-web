><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B1. Tổng trạng (da xanh, niêm nhạt), sinh hiệu mẹ, tim thai bất thường. Khám bụng: bụng ngoại khoa, sờ thấy thai qua thành bụng</p></span></div></foreignObject></g></g><g transform="translate(153, 228)" id="flowchart-B-781" class="node default"><rect height="120" width="290" y="-60" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -45)" style="" class="label"><rect></rect><foreignObject height="90" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B2–3. Chẩn đoán: vỡ tử cung trên vết mổ cũ, sốc mất máu, suy thai (VMC, đau bụng, ra huyết, CTG mất, xuất huyết nội)</p></span></div></foreignObject></g></g><g transform="translate(153, 399.25)" id="flowchart-C-783" class="node default"><rect height="142.5" width="290" y="-71.25" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -56.25)" style="" class="label"><rect></rect><foreignObject height="112.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B4. Gọi trợ giúp. Nằm đầu bằng, 2 đường truyền, NaCl 0,9% xả nhanh. XN đông cầm máu, CTM, nhóm máu, gan thận. Sonde tiểu, đăng ký máu</p></span></div></foreignObject></g></g><g transform="translate(153, 559.25)" id="flowchart-D-785" class="node default danger"><rect height="97.5" width="290" y="-48.75" x="-145" style="fill:#FDE2E2 !important;stroke:#C0392B !important" class="basic label-container"></rect><g transform="translate(-115, -33.75)" style="color:#7a1010 !important" class="label"><rect></rect><foreignObject height="67.5" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(122, 16, 16) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" style="color:#7a1010 !important"><p>Mổ lấy thai thượng khẩn: báo phòng mổ, thở O2, chuẩn bị máu, hồi sức sơ sinh, khoa nhi</p></span></div></foreignObject></g></g><g transform="translate(153, 719.25)" id="flowchart-E-787" class="node default"><rect height="142.5" width="290" y="-71.25" x="-145" style="" class="basic label-container"></rect><g transform="translate(-115, -56.25)" style="" class="label"><rect></rect><foreignObject height="112.5" width="230"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>B5. Tư vấn người nhà: mẹ (BHSS, sốc, truyền máu, thắt ĐMTC, cắt TC, tử vong); con (suy thai, tổn thương não, tử vong). Nguy cơ còn dù mổ</p></span></div></foreignObject></g></g></g></g></g></svg>